.imodal img{max-width:100%;max-height:78vh;border-radius:14px;box-shadow:0 30px 70px -20px #000;background:#fff}
.imodal-bar{display:flex;align-items:center;gap:10px;color:#fff;font-size:14px}
.imodal button{font:inherit;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 16px;cursor:pointer}
.imodal button:hover{background:rgba(255,255,255,.18)}
.imodal button:disabled{opacity:.35;cursor:default}
.imodal .close{position:absolute;top:-6px;right:-6px;width:36px;height:36px;padding:0;border-radius:50%}
</style>
<div class="imodal" id="imodal" role="dialog" aria-modal="true" aria-label="Infographics">
  <div class="imodal-box">
    <button class="close" id="imClose" type="button" aria-label="Close">&times;</button>
    <img id="imImg" alt="">
    <div class="imodal-bar">
      <button id="imPrev" type="button" aria-label="Previous infographic">&larr; Prev</button>
      <span id="imCount"></span>
      <button id="imNext" type="button" aria-label="Next infographic">Next &rarr;</button>
    </div>
  </div>
</div>
<script>
/* Infographic files sit next to index.html: ds_i1.png ... ds_i7.png, oomd_i1.png ..., agentic_i1.png ..., rm_i1.png ... */
(function(){
  var modal=document.getElementById("imodal"),img=document.getElementById("imImg"),
      cnt=document.getElementById("imCount"),prev=document.getElementById("imPrev"),
      next=document.getElementById("imNext"),closeBtn=document.getElementById("imClose"),
      cur={id:null,i:1,last:null};
  var msg=document.getElementById("imMsg")||(function(){var m=document.createElement("p");m.id="imMsg";m.style.cssText="margin:12px 0 0;font-size:14px;opacity:.8;text-align:center";img.parentNode.insertBefore(m,img.nextSibling);return m;})();
  img.onload=function(){ msg.textContent=""; img.style.opacity="1"; };
  img.onerror=function(){ msg.textContent="This infographic could not be loaded. Check the file name in the repo: "+img.getAttribute("data-f"); img.style.opacity=".25"; };
  function show(){
    var c=INFO[cur.id], f=c.p+"_i"+cur.i+"-200kb.jpeg";
    img.alt="Infographic "+cur.i+" of "+c.n;
    img.setAttribute("data-f",f);
    msg.textContent="Loading...";
    img.style.opacity=".5";
    img.src=f+"?v=1";
    img.decoding="async";
    cnt.textContent=cur.i+" / "+c.n;
    prev.disabled=cur.i<=1; next.disabled=cur.i>=c.n;
    // preload the next image so Next feels instant
    if(cur.i<c.n){ var p=new Image(); p.src=c.p+"_i"+(cur.i+1)+"-200kb.jpeg"; }
  }
  function open(id){ cur.id=id; cur.i=1; modal.classList.add("open"); show(); closeBtn.focus(); }
  function close(){ modal.classList.remove("open"); img.removeAttribute("src"); if(cur.last) cur.last.focus(); }
  document.addEventListener("click",function(e){
    var b=e.target.closest(".info");
    if(b){ cur.last=b; open(b.dataset.s); }
  });
  prev.addEventListener("click",function(){ if(cur.i>1){cur.i--;show();} });
  next.addEventListener("click",function(){ if(cur.i<INFO[cur.id].n){cur.i++;show();} });
  closeBtn.addEventListener("click",close);
  modal.addEventListener("click",function(e){ if(e.target===modal) close(); });
  document.addEventListener("keydown",function(e){
    if(!modal.classList.contains("open")) return;
    if(e.key==="Escape") close();
    if(e.key==="ArrowLeft") prev.click();
    if(e.key==="ArrowRight") next.click();
  });
})();
</script>
</body>
</html>
