<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic AI Cheat Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--card:rgba(255,255,255,0.03);--bd:rgba(255,255,255,0.09);--ink:#f3f4f8;--mut:#8a8fa3;--ac:#9d8bff;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Inter Tight",system-ui,sans-serif}
header{background:var(--ac);color:#07080b;text-align:center;padding:26px 14px}
h1{margin:0;font-size:1.8rem;font-weight:700}
main{max-width:900px;margin:auto;padding:10px 14px 40px}
h2{margin:32px 0 8px;padding:0 0 6px;color:var(--ac);border-bottom:2px solid var(--ac);font-size:1.25rem;font-weight:700}
section{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:8px;padding:4px 14px 10px;margin:12px 0}
h3{margin:10px 0 2px;color:var(--ac);font-size:1.08rem;font-weight:600}
h4{margin:8px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:600}
p{margin:2px 0}ul{margin:2px 0;padding-left:20px}li{margin:1px 0}li::marker{color:var(--ac)}
</style></head><body>
<header><h1>Agentic AI Cheat Sheet</h1></header>
<main id="m"></main>
<script>
const D=[
"#Unit 1: Foundations of Agentic AI",
["AI vs Generative AI vs Agentic AI","Traditional AI does one fixed task, generative AI creates content from prompts, agentic AI pursues a goal by planning, using tools and acting.",["Traditional: rules or trained model (fraud flag)","Generative: predicts next token (drafts reply)","Agentic: LLM + planning + memory + tools + autonomy"],"Banking fraud: model detects, LLM explains, agent blocks card, alerts customer, orders replacement.",["Calling any chatbot an agent","Giving full autonomy without approval"]],
["Chatbot vs autonomous agent","A chatbot answers one query at a time; an agent completes multi-step tasks.",["Chatbot: scripted, no tools, no memory","Agent: plans, calls APIs, adapts, remembers"],"Travel booking: chatbot lists flights; agent compares, books, replans if cancelled.",["Chatbot cannot recover from failure","Agent can book wrongly without checks"]],
["Agent cycle and components","An agent observes, reasons, plans, acts and evaluates until the goal is met.",["Perception, reasoning (LLM), planning, action, memory, learning","Characteristics: autonomy, goal focus, tool use, adaptability"],"Admissions agent: reads form, finds missing documents, emails applicant, escalates borderline cases.",["No stopping rule causes endless loops","Missing human-in-the-loop for final decisions"]],
["Agentic tools: Copilot, AutoGPT, Artifacts, n8n","Tools differ in capability and autonomy.",["Copilot: assistant inside Microsoft 365, low autonomy","AutoGPT: self-directed, high autonomy","Claude Artifacts: builds documents, code, apps, user-driven","n8n: workflow automation with AI nodes, best for business"],"Invoice routing with n8n and an AI step.",["AutoGPT can loop and cost many tokens","Artifacts do not run scheduled workflows"]],
["Rule-based vs agentic system","Rule-based systems react to fixed conditions; agentic systems pursue goals using feedback.",["Goal, environment interaction, planning, feedback"],"Factory overheating: rule starts fan; agent also slows line, checks fan, raises ticket, confirms cooling.",["Rules fail on unexpected cases","Agents need safety limits"]],
["Risks of unrestricted access","Unlimited access to email, files and payments turns mistakes into real damage.",["Least privilege","Spending and recipient limits","Human approval, audit logs, backups"],"Agent emailing confidential files to a wrong address.",["Prompt injection","Irreversible deletion","No audit trail"]],
["Use cases: hospital, campus, admissions, scheduling","Domain agents combine retrieval, tools and notifications.",["Find slots, check records, book, remind","Detect clashes, reallocate rooms, notify faculty","Always add approval for sensitive steps"],"Hospital: check history, book appointment, send reminder without diagnosis.",["Leaking patient data","Booking conflicts unhandled"]],
["Tokenization and embeddings","Tokens are text pieces the LLM reads; embeddings are vectors capturing meaning.",["Text, tokenizer, token IDs, embedding vector","Similar meaning gives nearby vectors (cosine similarity)"],"Query “three relevant papers” embedded and compared with abstract vectors; top 3 returned.",["Exceeding token limits","Poor embedding model for the domain"]],
["Prompts","A prompt is the instruction that guides the LLM.",["Zero-shot, one-shot, few-shot, system, instruction prompts","Good prompt: clear, specific, context-rich"],"System prompt: answer only from the given context.",["Vague or contradictory prompts","Too much irrelevant context"]],
["Retrieval and RAG","Retrieval-Augmented Generation fetches relevant documents first, then the LLM answers from them.",["Chunk, embed, store in vector DB","Embed query, top-k search, build prompt, generate with citation"],"Exam regulation bot retrieves the attendance clause and answers with clause number.",["Missing document gives hallucination","Weak chunking or outdated documents","Fix: answer only from context, relevance threshold, verifier, escalate"]],
["Semantic vs keyword retrieval","Keyword matches words; semantic matches meaning.",["Semantic finds “money back” = “refund”","Keyword is better for IDs and codes","Hybrid search is best"],"Legal assistant finds termination clause worded as cessation of agreement.",["Keyword misses paraphrases","Semantic can miss exact codes"]],
["Context window and token limits","The context window is the maximum tokens the LLM handles per request.",["Chunk, retrieve top-k, summarise (map-reduce)","Budget tokens, trim memory, cache evidence"],"Research assistant summarises each paper section, then summarises summaries.",["Sending whole papers","Losing details in the middle"]],
["Fixed knowledge base vs LLM knowledge","Knowledge base gives current, citable facts; LLM memory is frozen and may be wrong.",["Support agent answers product facts from manuals","LLM only phrases the reply"],"Error E45 fix taken from the service manual.",["Stale internal knowledge","Knowledge base not updated"]],
["ReAct framework","ReAct alternates Thought, Action, Observation until the task is complete.",["Thought: what is missing","Action: Search, Calculate, Finish","Observation: tool result, then repeat"],"Travel: weather, then transport comparison, then itinerary within budget.",["Repeating the same search","Wrong tool selection","No iteration limit","Fix: max steps, vary query or tool, fallback to human"]],
["ReAct vs Chain-of-Thought","CoT reasons inside the model; ReAct adds tools and verification.",["CoT: faster, no tools","ReAct: calculator, search, grounded results"],"Compound interest: ReAct uses a calculator for the exact value.",["CoT arithmetic slips","ReAct is slower and costlier"]],
["Verification of reasoning and actions","Never trust fluent reasoning without checking tool outputs.",["Validate ranges and sources","Cite evidence, report uncertainty","Human approval for risky actions"],"Healthcare assistant checks lab values and needs clinician sign-off.",["Hallucinated explanations","Errors propagating through steps"]],
["Route planning and monitoring loops","Plan stepwise, validate feasibility, replan on change.",["List stops, travel times, order by window, check constraints","Server loop: monitor, plan, execute, observe, replan"],"Delivery route checked against every time window; server restarted then metrics rechecked.",["Mental arithmetic errors","Restart loops without retry limits"]],

"#Unit 2: Architecture and Frameworks",
["Single-agent architecture","One LLM orchestrates the whole loop and chooses tools.",["Accept request, reason, call tools, iterate, respond"],"Personal assistant managing calendar, reminders and tasks.",["Overloaded with many tools","Repeated or invalid tool calls"]],
["Single vs multi-agent","Multi-agent systems use specialist agents plus a coordinator.",["Single: simple, easy to trace","Multi: parallel, modular, scalable but needs routing and logging"],"Warehouse with picking, inventory and dispatch agents.",["Coordination overhead","Agents bouncing tasks endlessly","Hard debugging"]],
["Centralised vs decentralised coordination","Central control gives a global view; decentralised gives resilience.",["Central: consistent, single point of failure","Decentralised: fast local decisions, possible conflicts","Hybrid often best"],"Disaster response with central priorities and local autonomy.",["Bottleneck at the centre","Duplicated effort at the edge"]],
["Design patterns: Tool-use, Reflection, Planning, ReAct","Four patterns that shape agent behaviour.",["Tool-use: call functions and use results","Reflection: critique and revise own output","Planning: plan, execute, replan","ReAct: reason with tool feedback"],"Testing assistant: Planning + Tool-use + ReAct + Reflection.",["Reflection without real tests","Plans never validated"]],
["LangChain and LangGraph","LangChain builds linear chains; LangGraph models graphs with state.",["LangChain: loader, splitter, embeddings, vector store, retriever, prompt, LLM","LangGraph: nodes, conditional edges, state, checkpoints, human interrupts"],"Code agent: generate, test, analyse, revise, escalate after attempts.",["Using chains for branching tasks","No stopping condition"]],
["FAISS vs Chroma","Both store vectors for semantic search.",["FAISS: fast library, large scale, no built-in filtering","Chroma: database with metadata filter and persistence"],"College chatbot with notices filtered by date uses Chroma.",["Stale index","Wrong chunking"]],
["AutoGen vs CrewAI","Both build multi-agent teams.",["AutoGen: conversational agents, code execution, termination rule","CrewAI: roles, tasks, dependencies"],"Coder and reviewer chat until APPROVED; researcher, writer, reviewer crew.",["Endless discussion","Unclear task dependencies"]],
["Improving retrieval accuracy and freshness","Retrieval quality depends on chunking, embeddings, search settings and data.",["Chunk 300 to 800 tokens with overlap","Hybrid search, re-ranking, tuned k","Version documents, re-index, filter active status"],"Obsolete policy removed by status filter.",["Too large or small chunks","Outdated policies served"]],
["Duplicate transactions and shared state","Two agents processing one request cause duplicates.",["Locks on shared state","Unique request IDs (idempotency)","Validation and human approval"],"Payment charged twice after a timeout retry.",["Race conditions","No reconciliation"]],

"#Unit 3: Multi-Agent Systems",
["Evaluation metrics","Metrics show whether an agent finishes tasks correctly and efficiently.",["Task completion rate, accuracy, latency, tokens, cost, recovery rate","Trajectory checks: plan quality, tool selection"],"82 of 100 bookings completed, 90% correct, 7 calls each.",["Final-answer accuracy only","Ignoring cost and safety"]],
["Benchmarks","Benchmarks test agents in standard tasks.",["ToolBench: tool and API use","AgentBench: interactive environments","MultiAgentBench, REALM-Bench, CLEAR, SOTOPIA-pi, MARL-EVAL"],"AgentBench reveals planning versus execution failures.",["Simulation differs from reality","Single score hides weak areas"]],
["A2A communication","Agent-to-Agent lets agents discover, delegate and report.",["Agent card, capability description","Task ID, assignment, status updates, artifacts"],"Research, analysis and report agents pass results through an orchestrator.",["Missing acknowledgements","Unclear capabilities"]],
["A2P and human supervision","Agent-to-Person asks humans to approve, clarify or escalate.",["Request with reason and risk","Approve, reject, clarify, escalate on timeout"],"Hospital agent proposing a discharge date change.",["Approval fatigue","No timeout path"]],
["Communication protocol design","Structured messages make collaboration reliable.",["Message ID, task ID, sender, receiver, type, payload","ACK, status, error, complete messages","Retries and timeouts"],"JSON message with task_id and COMPLETE notice.",["Duplicate or delayed messages","Inconsistent task status"]],
["Failure handling and security","Handle lost replies and protect shared data.",["Timeout, status query, retry, fallback, escalate","Authentication, encryption, role-based access, data minimisation"],"Remote agent silent: query status, retry, switch agent.",["Retrying without idempotency","Over-sharing confidential data"]],
["Conflict resolution and decision methods","Conflicting recommendations need a rule.",["Proposals with priority, coordinator decides","Majority voting, consensus, leader-based, weighted voting"],"Ambulance corridor beats traffic and pollution goals.",["Majority can be wrong","Consensus can deadlock"]],
["Roles, delegation and collective intelligence","Clear roles stop overlap; combining observations improves accuracy.",["Planner, researcher, executor, verifier","Single owner per function, event-based messages","Fuse sensor readings"],"University agents with a sole notification agent.",["Overlapping responsibilities","Developer ignoring reviewer feedback"]],
["Workflows and shared state","Workflows split tasks across stages with verification.",["Plan, retrieve, synthesise, verify, human review","Task registry and cache avoid duplicate searches"],"Literature survey: search, abstract analysis, summary, citation check.",["Duplicated work","Contradictory sources"]],
["Simulation and local vs global metrics","Simulation tests coordination safely before deployment.",["Normal and emergency scenarios","Local delay vs network-wide delay","Share neighbour information"],"Traffic agents improve one junction but worsen neighbours.",["Poorly calibrated simulator","Selfish local optimisation"]],

"#Unit 4: Evaluation, Alignment, Ethics, Governance",
["Evaluation and robustness","Judge adaptability, reliability, safety and user satisfaction, not accuracy alone.",["Segmented accuracy, escalation accuracy","Adversarial inputs, failure recovery tests","Monitor outdated answers"],"Help desk at 90% accuracy still fails complex complaints.",["Benchmarks with clean inputs only","Ignoring cost of errors"]],
["Alignment","Alignment makes actions match the user’s real intent and constraints.",["Hard limits in tools","Confirm preferences","Human approval, reversibility, logs"],"Purchasing agent bound by budget and preferences.",["Goal misalignment (cheapest bad option)","Proxy metrics gamed"]],
["Control architecture","Policy layers control what an agent may do.",["Input guard, policy engine, tool gateway, approval service, audit log"],"Sensitive action waits for human authorisation.",["Single filter trusted alone","No kill switch"]],
["Prompt injection defence","Malicious text in retrieved data tries to act as instructions.",["Validate input, treat documents as data","Least privilege access","Monitor tool calls, human approval, sandbox"],"Poisoned document asks agent to open restricted files.",["Relying on one defence","Agent credentials too broad"]],
["Explainability and transparency","Users and auditors must see why decisions were made.",["Trace logs, decision records, tool-call history, source citations","Confidence and uncertainty"],"Clinician sees evidence and sources for each treatment option.",["Unexplained different advice","Tamperable logs"]],
["Privacy by design","Build protection in from the start.",["Data minimisation, purpose limitation, role-based access","Encryption, masking, retention, consent"],"Campus assistant sees only needed student fields.",["Sensitive data in prompts or logs","No retention policy"]],
["Bias and fairness","Unfair outcomes harm groups and public trust.",["Compare selection rates by group","Remove proxy features, add fairness constraints","Human review, appeals"],"Recruitment agent ranking one group lower.",["Biased history data","Fairness not measured"]],
["Governance and frameworks","Frameworks guide responsible deployment.",["NIST AI RMF: govern, map, measure, manage","OECD AI principles","India DPDP Act 2023","Risk assessment, oversight, documentation, monitoring"],"Checklist for a campus multi-agent system.",["Compliance only on paper","Ignoring regional laws"]],
["Autonomy vs human control","High-impact decisions need review.",["Graded autonomy by risk and reversibility","Appeals and explanations for rejections"],"Industrial agent acts alone on low-risk steps, needs approval to shut the line.",["Unaccountable decisions","Customers unable to appeal"]],
["Multimodal and hybrid agents","Multimodal agents combine text, images and speech; hybrid systems pair LLM planning with verified execution.",["ASR, vision model, LLM fusion, text to speech","LLM plans, agents execute, verifier checks, human approves"],"Defect detection from camera, report, maintenance ticket.",["Noisy audio or images","Conflicting evidence in fusion","Privacy of recordings"]]
];
let h="",o=false;
D.forEach(d=>{if(typeof d=="string"){if(o)h+="</section>";o=false;h+=`<h2>${d.slice(1)}</h2>`;return}
h+=`<section><h3>${d[0]}</h3><h4>Definition</h4><p>${d[1]}</p><h4>Key components or steps</h4><ul>${d[2].map(x=>`<li>${x}</li>`).join("")}</ul><h4>Example</h4><p>${d[3]}</p><h4>Common pitfalls</h4><ul>${d[4].map(x=>`<li>${x}</li>`).join("")}</ul></section>`});
document.getElementById("m").innerHTML=h;
</script></body></html>
